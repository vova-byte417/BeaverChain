[pytest]
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=../p-mp2nnvkraon8mn-worker2/model_registry
    --cov=../p-mp2nnvkraon8mn-worker2/optimization_toolchain
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    model_registry: 模型注册表测试
    optimization: 优化工具链测试
    orchestration: 编排引擎测试
    evaluation: 评估模块测试
