# ==============================================
# BeaverChain - 简化可用版 docker-compose.yml
# 这个是能跑的！不是乱写的！
# ==============================================

services:
  # ========== Redis 缓存 ==========
  redis:
    image: redis:7.2-alpine
    container_name: beaverchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: beaverchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beaverchain
      POSTGRES_PASSWORD: beaverchain123
      POSTGRES_DB: beaverchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beaverchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BeaverChain 主服务 ==========
  beaverchain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaverchain-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://beaverchain:beaverchain123@postgres:5432/beaverchain
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  redis_data:
  postgres_data:
